name: YESI-WMS Enterprise CI, Security & Release Pipeline

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-and-secrets:
    name: Secret Detection, Config Validation & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Scan repository for leaked secrets & insecure session writes
        run: npm run check:security
      - name: Gitleaks git-history secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
      - name: Production dependency vulnerability audit (critical)
        run: npm audit --omit=dev --audit-level=critical

  quality-test-and-build:
    name: ESLint, Unit Suite & Production Bundle
    needs: security-and-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: ESLint static analysis
        run: npm run lint
      - name: Vitest enterprise unit tests (Security, RBAC, Config, Outbox, Scan)
        run: npm test
      - name: Verify graceful Offline-Edge build (no cloud env vars)
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npm run build
      - name: Build production bundle with configured environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WMS_TENANT_CODE: YESI-FZCO
          VITE_WMS_DEFAULT_WAREHOUSE: DXB-FC1
        run: npm run build
      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: yesi-wms-dist
          path: dist/

  e2e-smoke:
    name: Playwright Fulfillment E2E Smoke
    needs: quality-test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
