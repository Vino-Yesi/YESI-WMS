name: YESI-WMS CI, Security & Release Pipeline

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    name: TypeScript, ESLint & Production Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint codebase
        run: npm run lint
      - name: Typecheck & build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WMS_TENANT_CODE: YESI-FZCO
          VITE_WMS_DEFAULT_WAREHOUSE: DXB-FC1
        run: npm run build
      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: yesi-wms-dist
          path: dist/

  e2e-smoke:
    name: Playwright Fulfillment E2E Smoke
    needs: lint-typecheck-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
