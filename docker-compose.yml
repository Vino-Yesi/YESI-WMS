services:
  wms-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://xtbbnnwthhngapmxqyis.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-sb_publishable_ifExJmWE1FUV3hj968_Yzw_0Hr1ubJD}
        VITE_WMS_TENANT_CODE: ${VITE_WMS_TENANT_CODE:-YESI-FZCO}
        VITE_WMS_DEFAULT_WAREHOUSE: ${VITE_WMS_DEFAULT_WAREHOUSE:-DXB-FC1}
    ports:
      - "8080:8080"
    restart: unless-stopped

  redis-edge-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=yesi-wms-monitor
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
